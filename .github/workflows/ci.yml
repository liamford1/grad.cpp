name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Install BLAS (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libopenblas-dev

      - name: Configure
        run: cmake -S . -B build -DBUILD_TESTS=ON -DGRAD_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build -j

      # The PyTorch baseline keeps its own copy of the presets; fail if it
      # drifts from grad's. Needs only the binary and python3, not torch.
      - name: PyTorch baseline presets match grad presets
        if: runner.os == 'Linux'
        run: python3 benchmarks/check_presets.py ./build/grad

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

      - name: Install package
        run: cmake --install build --prefix "${{ runner.temp }}/grad-install"

      - name: Build against the installed package
        run: |
          cmake -S tests/package -B build-package -DCMAKE_PREFIX_PATH="${{ runner.temp }}/grad-install"
          cmake --build build-package
          ./build-package/consumer

      - name: Training smoke test
        run: ./build/grad train-fast

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # A managed Python, so pip installs without touching the runner's
      # system Python (Ubuntu 24.04 refuses that under PEP 668).
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # clang for the compilation database: configuring with GCC would put
      # GCC-only flags (-flto=auto, -ffat-lto-objects) in front of
      # clang-tidy. The tool versions are pinned; other versions format
      # and diagnose differently.
      - name: Install BLAS, clang, clang-format and clang-tidy
        run: |
          sudo apt-get update && sudo apt-get install -y libopenblas-dev clang
          pip install clang-format==19.1.7 clang-tidy==19.1.0

      - name: clang-format
        run: tools/lint.sh format

      - name: Configure (compilation database only)
        env:
          CC: clang
          CXX: clang++
        run: cmake -S . -B build -DBUILD_TESTS=ON -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      # Every C++ translation unit the build compiles; the Objective-C++
      # Metal backend is macOS-only and not part of this build.
      - name: clang-tidy
        run: JOBS=$(nproc) tools/lint.sh tidy build

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install BLAS
        run: sudo apt-get update && sudo apt-get install -y libopenblas-dev

      # The project's warning flags apply here too (they are
      # per-target), but not -Werror: GCC's ASan instrumentation is known
      # to raise false -Wmaybe-uninitialized / -Wstringop-* warnings, and
      # the build-and-test job already gates on a clean build.
      - name: Configure ASan and UBSan
        run: >-
          cmake -S . -B build-sanitize
          -DBUILD_TESTS=ON
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"

      - name: Build
        run: cmake --build build-sanitize -j

      - name: Sanitizer tests
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build-sanitize --output-on-failure
