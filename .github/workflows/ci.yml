name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Install BLAS (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libopenblas-dev

      - name: Configure
        run: cmake -S . -B build -DBUILD_TESTS=ON -DGRAD_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build -j

      # The PyTorch baseline keeps its own copy of the presets; fail if it
      # drifts from grad's. Needs only the binary and python3, not torch.
      - name: PyTorch baseline presets match grad presets
        if: runner.os == 'Linux'
        run: python3 benchmarks/check_presets.py ./build/grad

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

      - name: Install package
        run: cmake --install build --prefix "${{ runner.temp }}/grad-install"

      - name: Build against the installed package
        run: |
          cmake -S tests/package -B build-package -DCMAKE_PREFIX_PATH="${{ runner.temp }}/grad-install"
          cmake --build build-package
          ./build-package/consumer

      - name: Training smoke test
        run: ./build/grad train-fast

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install BLAS
        run: sudo apt-get update && sudo apt-get install -y libopenblas-dev

      # The project's -Wall -Wextra -Wpedantic apply here too (they are
      # per-target), but not -Werror: GCC's ASan instrumentation is known
      # to raise false -Wmaybe-uninitialized / -Wstringop-* warnings, and
      # the build-and-test job already gates on a clean build.
      - name: Configure ASan and UBSan
        run: >-
          cmake -S . -B build-sanitize
          -DBUILD_TESTS=ON
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"

      - name: Build
        run: cmake --build build-sanitize -j

      - name: Sanitizer tests
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build-sanitize --output-on-failure
